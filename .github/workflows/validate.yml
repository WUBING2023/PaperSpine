name: Validate skill

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image and DOCX test dependencies
        run: python -m pip install pillow lxml
      - name: Run script tests
        run: python -m unittest discover -s tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint scripts and tests
        run: ruff check src/scripts tests

  dist-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify committed public Skill projections
        run: python paperspine5/release_tools/verify_public_skill_sync.py
      - name: Verify full localized READMEs
        run: python -B "paperspine5/core/07_发布页/v6/localization.py" . --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Run LaTeX-to-Word end-to-end test
        run: python -m unittest tests.test_e2e_word
