name: Deploy stargazer atlas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  release:
    types: [published, prereleased]
  push:
    branches: [main]
    paths:
      - "atlas/**"
      - "website/**"
      - "paperspine5/core/07_发布页/v6/**"
      - "paperspine5/release_tools/*.py"
      - ".github/workflows/atlas.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check atlas interactions and browser scripts
        run: |
          node --test atlas/model.test.cjs
          for script in atlas/{atlas,contributors}.js paperspine5/core/07_发布页/v6/{live-data,preview,v6-content}.js; do node --check "$script"; done

      - name: Restore cached stargazer profiles
        uses: actions/cache@v4
        with:
          path: |
            atlas/stargazers_raw.json
            atlas/data.js
            atlas/repository.json
            public-snapshots
          key: atlas-stargazers-${{ github.run_id }}
          restore-keys: |
            atlas-stargazers-

      - name: Refresh stargazer data
        env:
          ATLAS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ATLAS_GITHUB_TOKEN" ]; then
            echo "::error::The GitHub Actions repository token is unavailable."
            exit 1
          fi
          python -B atlas/public_feed.py seed
          if python atlas/fetch_stargazers.py; then
            python atlas/public_feed.py refresh
          else
            echo "::warning::Profile refresh unavailable; retaining the dated aggregate"
          fi
          cp atlas/data.js website/community/data.js

      - name: Refuse empty atlas data
        run: python atlas/validate_data.py atlas/data.js

      - name: Verify the V5 community view uses the refreshed atlas
        run: |
          python atlas/validate_data.py website/community/data.js
          cmp atlas/data.js website/community/data.js

      - name: Build and verify PaperSpine5 website
        run: python paperspine5/release_tools/build_site.py

      - name: Assemble site (static files only)
        run: python -B paperspine5/release_tools/assemble_pages.py _site

      - name: Snapshot V6 release download statistics
        if: ${{ hashFiles('website/v6/downloads/channel.json') != '' }}
        env:
          PAPERSPINE_RELEASE_READ_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c "import json; print(json.load(open('website/v6/downloads/channel.json'))['editions']['skill']['version'])")
          dir="public-snapshots/$tag"
          mkdir -p "$dir"
          if ! python -B 'paperspine5/core/07_发布页/v6/build_v6.py' download-stats website/v6/downloads "$dir/download-stats.json"; then
            echo "::warning::Using the previous snapshot for the same release"
          fi
          cp "$dir"/download-stats.json "$dir"/downloads-*.svg _site/v6/
          python -B atlas/readme_activity.py _site

      - name: Snapshot GitHub contributors
        env:
          ATLAS_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public-snapshots
          if ! python -B atlas/community_snapshot.py public-snapshots/contributors-data.json; then
            echo "::warning::Using the previous contributor snapshot"
          fi
          cp public-snapshots/contributors-data.json _site/contributors/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
