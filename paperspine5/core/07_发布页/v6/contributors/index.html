<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览 PaperSpine 的开源贡献者、贡献记录和原始证据。">

  <link rel="icon" href="paperspine-dragon.webp" type="image/webp">
  <link rel="stylesheet" href="utilities.css">
  <link rel="stylesheet" href="contribute.css">
  <link rel="stylesheet" href="../site-header.css">
  <script src="contributor-card-effects.js" defer></script>
  <script src="ledger.js" defer></script>
</head>
<body>

  <path d="M7 17 17 7" /></symbol>

  </svg>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="../index.html" data-site-home aria-label="PaperSpine 首页">
        <span class="wordmark-symbol" aria-hidden="true"><img class="wordmark-icon" src="../paperspine-dragon.png" width="40" height="40" alt=""></span>PaperSpine<span class="domain">.io</span>
      </a>
      <nav class="site-nav" aria-label="贡献页导航">
        <a href="#/contributors" data-nav="overview">贡献者</a>
        <a href="#/ledger" data-nav="ledger">贡献账本</a>
        <a href="#/sync" data-nav="sync">同步日志</a>
      </nav>
      <div class="header-actions">
        <button id="languageSwitch" class="language-switch" type="button" aria-label="切换至英文" hidden><span lang="en">EN</span></button>
        <a class="github" href="https://github.com/WUBING2023/PaperSpine">
          <img src="../agent-icons/github.svg" width="24" height="24" alt="">
          GitHub
        </a>
      </div>
    </div>
  </header>

  <main id="appMain">
    <noscript><div class="shell py-10">请启用 JavaScript 以浏览贡献账本。</div></noscript>
  </main>

  <dialog id="detailModalBackdrop" class="record-dialog" aria-labelledby="drawerTitle">
    <div id="detailDrawer" class="record-drawer">
      <div class="px-6 py-4 border-b border-ink-200 flex items-center justify-between gap-4">
        <div class="min-w-0">
          <p id="drawerLabel" class="font-mono text-xs text-ink-500">贡献记录与证据</p>
          <h2 id="drawerTitle" class="text-sm font-semibold text-ink-950 truncate mt-0.5"></h2>
        </div>
        <form method="dialog">
          <button id="closeDrawer" type="submit" class="focus-ring p-1.5 rounded-md hover:bg-ink-100" aria-label="关闭详情" autofocus>
            <svg class="icon w-4 h-4" aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
        </form>
      </div>
      <div id="drawerBody" class="flex-1 overflow-y-auto px-6 py-5 space-y-6"></div>
    </div>
  </dialog>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" role="status"></div>
</body>
</html>
