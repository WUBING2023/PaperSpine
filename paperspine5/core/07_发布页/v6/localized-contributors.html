<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperSpine · $contributors</title>
  $alternates
  <link rel="stylesheet" href="../community.css"><link rel="stylesheet" href="../v6/languages.css">
  <script src="../v6/live-data.js" defer></script>
  <script src="../v6/language-nav.js" defer></script>
  <script src="contributors.js" defer></script>
</head>
<body class="contributors">
  <header class="nav"><div class="wrap"><strong>PaperSpine</strong>
    <nav><a href="../v6/$lang/">PaperSpine V6</a><a href="../?lang=$lang">$atlas</a>$menu</nav></div></header>
  <main id="content">
    <section class="wrap hero"><h1>$contributors</h1></section>
    <section class="wrap release-credits" id="v6-contributions">
      <div class="credits-head"><h2>$credits</h2><p><a href="./#v6-contributions" hreflang="en">$history ↗</a></p></div>
      <ol class="credit-history"><li class="credit-row">
        <div class="credit-when"><a href="https://github.com/WUBING2023/PaperSpine/pull/19">PR #19</a></div>
        <div class="credit-work"><p><a href="https://github.com/Lauyanng">@Lauyanng</a> · $credit</p></div>
      </li></ol>
    </section>
    <section class="wrap">
      <label for="contributor-search">$search</label><input id="contributor-search" type="search" disabled>
      <p id="contributor-status" aria-live="polite" data-visible="$visible" data-empty="$empty" data-error="$error"></p>
      <ul class="roster" data-commits="$contributions"></ul>
      <p>$as_of <time id="data-date"></time></p>
    </section>
  </main>
</body>
</html>
