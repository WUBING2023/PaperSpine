<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="探索 PaperSpine 社区星标的全球地域与高校分布。">
  <title>PaperSpine · 社区星图</title>
  <link rel="stylesheet" href="atlas-view.css?v=organization-atlas">
  <script defer src="data.js"></script>
  <script defer src="worldgeo.js"></script>
  <script defer src="china-provinces.js"></script>
  <script defer src="model.js"></script>
  <script defer src="language.js"></script>
  <script defer src="v6/live-data.js"></script>
  <!-- language-alternates -->
  <link rel="stylesheet" href="v6/languages.css?v=full-locales">
  <script src="v6/language-nav.js?v=full-locales" defer></script>
  <script defer src="v6/atlas-locales.js?v=full-locales"></script>
  <script defer src="organization-globe.js?v=uniform-rotation"></script>
  <script defer src="atlas.js?v=organization-atlas"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-inner"><div class="brand"><span class="brand-icon" aria-hidden="true">✦</span> PaperSpine <span class="brand-divider"></span><span class="brand-section" data-text>社区</span></div>
      <div class="top-actions">
        <a data-text data-en-href="v6/" href="v6/zh/">V6 官网</a>
        <a data-text href="v6/contributors/?lang=zh-CN" data-contributor-ledger>贡献者</a>
        <a href="https://github.com/WUBING2023/PaperSpine">GitHub ↗</a>
        <!-- language-menu -->
      </div>
    </div>
  </header>
  <main>
    <div class="intro">
      <div>
        <h1 data-text>社区星图</h1>
        <p data-text>从全球地域到高校网络，探索 PaperSpine 星标的分布。</p>
      </div>
      <div class="stats" aria-label="快照统计">
        <div><strong id="total">—</strong><span data-text>GitHub 星标</span></div>
        <div><strong id="sample">—</strong><span data-text>已采集资料</span></div>
        <div><strong id="regions">—</strong><span data-text>国家与地区</span></div>
        <div><strong id="schools">—</strong><span data-text>高校记录</span></div>
        <div><strong id="companies">—</strong><span data-text>组织记录</span></div>
      </div>
    </div>
    <div class="toolbar">
      <div class="switcher" role="group" aria-label="地图视图">
        <button data-mode="global" aria-pressed="true"><span aria-hidden="true">◎</span><span data-text>全球分布</span></button>
        <button data-mode="schools" aria-pressed="false"><span aria-hidden="true">◇</span><span data-text>高校分布</span></button>
        <button data-mode="companies" aria-pressed="false"><span aria-hidden="true">▦</span><span data-text>公司 / 组织</span></button>
      </div>
      <span class="snapshot"><i></i> <span data-text>聚合快照</span> <time id="date"></time></span>
    </div>
    <div class="workspace">
      <section class="map-card" id="map-card" aria-labelledby="map-title">
        <h2 id="map-title" hidden></h2>
        <div class="map-stage">
          <svg id="map" viewBox="0 0 960 500" role="group" aria-labelledby="map-title">
            <defs>
              <radialGradient id="pin-orange">
                <stop offset="0%" stop-color="#ef6a20" stop-opacity=".96"/>
                <stop offset="62%" stop-color="#ef611b" stop-opacity=".84"/>
                <stop offset="84%" stop-color="#ef611b" stop-opacity=".42"/>
                <stop offset="100%" stop-color="#ef611b" stop-opacity="0"/>
              </radialGradient>
              <filter id="glow" x="-250%" y="-250%" width="600%" height="600%">
                <feGaussianBlur stdDeviation="4"/>
              </filter>
            </defs>
            <g id="terrain" aria-hidden="true"></g>
            <g id="markers"></g>
          </svg>
          <div id="map-selection" class="map-selection" aria-hidden="true" hidden>
            <strong></strong><span></span>
          </div>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
      </section>
      <section id="organization-globe" hidden>
        <div class="globe-stage">
          <canvas tabindex="0"></canvas>
          <div class="globe-destinations"></div>
        </div>
      </section>
      <aside class="directory" aria-labelledby="directory-title">
        <div class="directory-head">
          <h2 id="directory-title"></h2>
          <label class="search"><span aria-hidden="true">⌕</span><input type="search" id="query" aria-label="搜索"></label>
          <div class="controls" id="school-filters" hidden>
            <select id="country" aria-label="国家或地区"></select>
            <select id="province" aria-label="省级地区"></select>
            <select id="city" aria-label="城市"></select>
          </div>
        </div>
        <div id="selection" class="selection" aria-live="polite" hidden></div>
        <div class="list-head"><span id="results" aria-live="polite"></span><span id="list-stars" data-text>星标</span></div>
        <ol id="list" aria-label="分布列表"></ol>
        <div id="organizations" hidden></div>
      </aside>
    </div>
    <footer><p id="source-note"></p><a data-text href="https://github.com/WUBING2023/PaperSpine/stargazers">查看 GitHub 星标 ↗</a></footer>
    <noscript>此预览需要启用 JavaScript。</noscript>
  </main>
</body>
</html>
